<!DOCTYPE html>
<!--
    Room-time overlay for the new FUNtoon server, shipped in the fun2n build
    (scripts/build-fun2n.js copies it to build-fun2n/tracking.html).  Add it
    to OBS as a browser source:  tracking.html?channel=<login>&token=<token>
    where the token is the channel's listen token (funtoon2snes builds this
    URL for you).  It listens on FUNtoon's events WebSocket, on the same site
    it's served from, for the custom events funtoon2snes sends.
-->

        }

        #container {
            border-radius: 5px;
            background-color: rgba(56, 56, 56, 0.502);
            color: white;
            padding: 3px;
            display: inline-block;
        }

        #invalid {
            display: none;
            background-color: red;
            color: white;
            font-weight: 500;
        }

        #prTime::before {
            content: 'RTA: ';
        }

        #prSec.with-content::after {
            content: 'ˢ';
        }
        #prFrm.with-content::after {
            content: 'ᶠ'
        }

        #rtaTime::before {
            content: ' (';
        }
        #rtaTime::after {
            content: ' sec) ';
        }

        #igtTime::before {
            content: ' IGT: ';
        }

        #igtSec.with-content::after {
            content: 'ˢ';
        }
        #igtFrm.with-content::after {
            content: 'ᶠ'
        }

        #lagTime::before {
            content: ' Lag: ';
        }
        #lagTime.with-content::after {
            content: 'ᶠ';
        }
    </style>

            function getRoomName(roomID) {
                for (const key in Rooms) {
                    if (Rooms[key] === roomID) {
                        return key;
                    } else {
                        for (const key2 in Rooms[key]) {
                            if (Rooms[key][key2] === roomID) {
                                return key2;
                            }
                        }
                    }
                }
                return "Unknown"
            }
            const params = new Proxy(new URLSearchParams(window.location.search), {
                get: (searchParams, prop) => searchParams.get(prop),
            });
            const allowPractice = params.practice === '1' || (params.practice || '').toLowerCase() === 'true';
            // The events WebSocket closes with these when the token is wrong
            // (4401) or can't listen to this channel (4403): retrying won't help.
            const AUTH_FAILURES = [4401, 4403];

            function connect() {
                console.log('Connecting...');
                const scheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
                const channel = encodeURIComponent((params.channel || '').toLowerCase());
                const token = encodeURIComponent(params.token || '');
                var ws = new WebSocket(`${scheme}://${window.location.host}/ws/events/${channel}/?token=${token}`);
                ws.onopen = function() {
                    console.log('Connected');
                };

                ws.onmessage = function(e) {
                    const msg = JSON.parse(e.data);
                    console.log(msg);
                    if (msg.type !== 'custom-event') {
                        return;
                    }
                    const { event, data } = msg;
                    if (event === 'gameROMDetected' || event === 'resetGame') {
                        document.getElementById('roomName').innerText = '--';
                        document.getElementById('prSec').innerText = '--';
                        document.getElementById('prFrm').innerText = '--';
                        document.getElementById('rtaTime').innerText = '--';
                        document.getElementById('igtSec').innerText = '--';
                        document.getElementById('igtFrm').innerText = '--';
                        document.getElementById('lagTime').innerText = '--';

                        document.getElementById('roomName').className = '';
                        document.getElementById('prSec').className = '';
                        document.getElementById('prFrm').className = '';
                        document.getElementById('rtaTime').className = '';
                        document.getElementById('igtSec').className = '';
                        document.getElementById('igtFrm').className = '';
                        document.getElementById('lagTime').className = '';
                    } else if (event === 'smRoomTime') {
                        if (allowPractice || !data.practice) {
                            const ffrm = Math.round(data.frameCount % 60.098813897441);
                            const fsec = Math.floor(data.frameCount / 60.098813897441) + (ffrm === 60);
                            const ifrm = Math.round((data.igtFrames || 0) % 60);
                            const isec = Math.floor((data.igtFrames || 0) / 60) + (ifrm === 60);
                            document.getElementById('roomName').innerText = '' + getRoomName(data.roomID);
                            document.getElementById('prSec').innerText = `${fsec}`;
                            document.getElementById('prFrm').innerText = `${`${ffrm % 60}`.padStart(2,'0')}`;
                            document.getElementById('rtaTime').innerText = `${+data.totalSeconds.toFixed(2)}`;
                            document.getElementById('igtSec').innerText = `${isec}`;
                            document.getElementById('igtFrm').innerText = `${`${ifrm % 60}`.padStart(2,'0')}`;
                            document.getElementById('lagTime').innerText = `${data.lagFrames}`;

                            document.getElementById('roomName').className = 'with-content';
                            document.getElementById('prSec').className = 'with-content';
                            document.getElementById('prFrm').className = 'with-content';
                            document.getElementById('rtaTime').className = 'with-content';
                            document.getElementById('igtSec').className = 'with-content';
                            document.getElementById('igtFrm').className = 'with-content';
                            document.getElementById('lagTime').className = 'with-content';
                        }
                    } else if (event === 'smMBPhaseTime') {
                        if (allowPractice || !data.practice) {
                            const ffrm = Math.round(data.frameCount % 60.098813897441);
                            const fsec = Math.floor(data.frameCount / 60.098813897441) + (ffrm === 60);
                            const ifrm = Math.round((data.igtFrames || 0) % 60);
                            const isec = Math.floor((data.igtFrames || 0) / 60) + (ifrm === 60);
                            document.getElementById('prSec').innerText = `${fsec}`;
                            document.getElementById('prFrm').innerText = `${`${ffrm % 60}`.padStart(2,'0')}`;
                            document.getElementById('rtaTime').innerText = `${+data.totalSeconds.toFixed(2)}`;
                            document.getElementById('igtSec').innerText = `${isec}`;
                            document.getElementById('igtFrm').innerText = `${`${ifrm % 60}`.padStart(2,'0')}`;
                            document.getElementById('lagTime').innerText = `${data.lagFrames}`;

                            document.getElementById('roomName').className = 'with-content';
                            document.getElementById('prSec').className = 'with-content';
                            document.getElementById('prFrm').className = 'with-content';
                            document.getElementById('rtaTime').className = 'with-content';
                            document.getElementById('igtSec').className = 'with-content';
                            document.getElementById('igtFrm').className = 'with-content';
                            document.getElementById('lagTime').className = 'with-content';
                        }
                    }
                };

                ws.onclose = function(e) {
                    if (AUTH_FAILURES.includes(e.code)) {
                        document.getElementById('invalid').style.display = 'block';
                        return;
                    }
                    console.log('Socket is closed. Reconnect will be attempted in 1 second.', e.reason);
                    setTimeout(function() {
                        connect();
                    }, 1000);
                };

                ws.onerror = function(err) {
                    console.error('Socket encountered error: ', err.message, 'Closing socket');
                    ws.close();
                };
            }

            connect();
